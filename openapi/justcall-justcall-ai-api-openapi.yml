        '500':
          description: This is due to internal server error reason, in this case please contact our support team with attached uuid.
      tags:
      - JustCall AI
      security:
      - AccessToken: []
  /v2/meetings_ai/{instance_sid}:
    get:
      operationId: meeting_ai_get
      summary: Get AI data
      description: Retrieve AI generated analysis for a particular instance of a meeting using this endpoint.
      parameters:
      - name: instance_sid
        required: true
        in: path
        description: Unique sid of the meeting instance generated by JustCall
