openapi: 3.2.0
info:
  title: JustCall AI API
  description: 'REST APIs

    The REST APIs provide programmatic access to read and write JustCall data. Create a new contact, read them, add notes, and more'
  version: '2'
  contact: {}
servers:
- url: https://api.justcall.io
tags:
- name: JustCall AI
paths:
  /v2/calls_ai:
    get:
      operationId: call_ai_list
      summary: List calls AI data
      description: Utilize this endpoint to access AI generated analysis for JustCall and Sales Dialer calls.
      parameters:
      - name: platform
        required: false
        in: query
        description: Select the platform to retrieve associated call details.
        schema:
          default: justcall
          enum:
          - justcall
          - sales_dialer
          type: string
      - description: Set fetch_transcription to true to fetch the transcription generated by JustCall AI for your call. Default entry is false.
        required: false
        name: fetch_transcription
        in: query
        schema:
          default: false
          type: boolean
      - description: Set fetch_summary to true to fetch the summary generated by JustCall AI for your call. Default entry is true.
        required: false
        name: fetch_summary
        in: query
        schema:
          default: true
          type: boolean
      - description: Set fetch_ai_insights to true to fetch the coaching insights generated by JustCall AI for your call. Default entry is true.
        required: false
        name: fetch_ai_insights
        in: query
        schema:
          default: true
          type: boolean
      - name: agent_id
        required: false
        in: query
        description: ID of the agent for whom the AI data for calls are to be fetched. Agent ID can be accessed using <a href="https://justcall.io/developer-docs/#list_users">List all users API</a>.
        schema:
          type: number
      - name: from_datetime
        required: false
        in: query
        description: Datetime in <b>yyyy-mm-dd hh:mm:ss</b> or <b>yyyy-mm-dd</b> format starting from when the calls AI data are to be fetched in <b>UTC Timezone</b>.
        schema:
          type: string
      - name: to_datetime
        required: false
        in: query
        description: Datetime in <b>yyyy-mm-dd hh:mm:ss</b> or <b>yyyy-mm-dd</b> format till when the calls AI data are to be fetched in <b>UTC Timezone</b>.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Page number for which calls are to be fetched.
        schema:
          type: number
      - name: per_page
        required: false
        in: query
        description: Number count of calls to be fetched per page.<br>Default value is 10 and maximum value is 20.
        schema:
          type: number
      - name: order
        required: false
        in: query
        description: 'Order in which the calls should appear based on ‘Date created’ASC : Older data will appear first followed by recent oneDESC: Recent data will appear first followed by older one'
        schema:
          default: desc
          enum:
          - asc
          - desc
          - natural
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallAiResponseDTOV2'
        '400':
          description: Failed due to bad request params.
        '401':
          description: Failed due to unauthorized access.
        '403':
          description: This error occurred when there is some validation error or you don't have access to that resource.
        '404':
          description: Requested resource may not exist.
        '500':
          description: This is due to internal server error reason, in this case please contact our support team with attached uuid.
      tags:
      - JustCall AI
      security:
      - AccessToken: []
  /v2.1/calls_ai:
    get:
      operationId: call_ai_list_v21
      summary: List calls AI data
      description: Utilize this endpoint to access AI generated analysis for JustCall and Sales Dialer calls.
      parameters:
      - name: platform
        required: false
        in: query
        description: Select the platform to retrieve associated call details.
        schema:
          default: justcall
          enum:
          - justcall
          - sales_dialer
          type: string
      - description: Set fetch_transcription to true to fetch the transcription generated by JustCall AI for your call. Default entry is false.
        required: false
        name: fetch_transcription
        in: query
        schema:
          default: false
          type: boolean
      - description: Set fetch_summary to true to fetch the summary generated by JustCall AI for your call. Default entry is true.
        required: false
        name: fetch_summary
        in: query
        schema:
          default: true
          type: boolean
      - description: Set fetch_ai_insights to true to fetch the coaching insights generated by JustCall AI for your call. Default entry is true.
        required: false
        name: fetch_ai_insights
        in: query
        schema:
          default: true
          type: boolean
      - name: agent_id
        required: false
        in: query
        description: ID of the agent for whom the AI data for calls are to be fetched. Agent ID can be accessed using <a href="https://justcall.io/developer-docs/#list_users">List all users API</a>.
        schema:
          type: number
      - name: from_datetime
        required: false
        in: query
        description: Datetime in <b>yyyy-mm-dd hh:mm:ss</b> or <b>yyyy-mm-dd</b> format starting from when the calls AI data are to be fetched in <b>user's timezone</b>.
        schema:
          type: string
      - name: to_datetime
        required: false
        in: query
        description: Datetime in <b>yyyy-mm-dd hh:mm:ss</b> or <b>yyyy-mm-dd</b> format till when the calls AI data are to be fetched in <b>user's timezone</b>.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Page number for which calls are to be fetched.
        schema:
          type: number
      - name: per_page
        required: false
        in: query
        description: Number count of calls to be fetched per page.<br>Default value is 10 and maximum value is 20.
        schema:
          type: number
      - name: order
        required: false
        in: query
        description: 'Order in which the calls should appear based on ‘Date created’ASC : Older data will appear first followed by recent oneDESC: Recent data will appear first followed by older one'
        schema:
          default: desc
          enum:
          - asc
          - desc
          - natural
          type: string
      - description: Set fetch_action_items to true to fetch the action items generated by JustCall AI for your call. Default entry is true.
        required: false
        name: fetch_action_items
        in: query
        schema:
          default: true
          type: boolean
      - description: Set fetch_smart_chapters to true to fetch the smart chapters generated by JustCall AI for your call. Default entry is true.
        required: false
        name: fetch_smart_chapters
        in: query
        schema:
          default: true
          type: boolean
      - name: phone_number
        required: false
        in: query
        description: Phone or Calling number (JustCall or Sales Dialer) for which AI-generated call data will be fetched. The number must be linked with the selected platform. If no platform is specified, the default is <b>justcall</b>.
        schema:
          type: string
      - name: ai_agent_ids
        required: false
        in: query
        description: IDs of the AI agents for which the calls are to be fetched. AI Agent IDs can be accessed using <a href="https://developer.justcall.io/reference/list_voice_agents_v21"> List all AI agents API</a>.
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallAiResponseDTOV21'
        '400':
          description: Failed due to bad request params.
        '401':
          description: Failed due to unauthorized access.
        '403':
          description: This error occurred when there is some validation error or you don't have access to that resource.
        '404':
          description: Requested resource may not exist.
        '500':
          description: This is due to internal server error reason, in this case please contact our support team with attached uuid.
      tags:
      - JustCall AI
      security:
      - AccessToken: []
