  /v2/meetings_ai:
    get:
      operationId: meeting_ai_list
      summary: List meetings AI data
      description: Utilize this endpoint to access AI generated analysis for all instances from all the meetings or filter instances based on a specific meeting Id(applicable for recurring meetings where there are multiple instances for each meeting Id).
      parameters:
      - name: platform
        required: false
        in: query
        description: Select the platform to retrieve associated meeting details.
        schema:
          enum:
          - zoom
          - google_meet
          type: string
      - name: meeting_id
        required: false
        in: query
        description: Filter meeting instances based on the Id of the meeting. This Id is unique for each meeting URL and can have multiple instances recorded under it for recurring events under the same URL.
        schema:
          type: string
      - description: Set fetch_transcription to true to fetch the transcription generated by JustCall AI for your meeting instances. Default entry is false. Please note that the list of speakers is only returned along with the transcription hence it will only appear when fetch_transcription is set to true.
        required: false
        name: fetch_transcription
        in: query
        schema:
          default: false
          type: boolean
      - description: Set fetch_summary to true to fetch the summary generated by JustCall AI for your meeting. Default entry is true.
        required: false
        name: fetch_summary
        in: query
        schema:
          default: true
          type: boolean
      - description: Set fetch_ai_insights to true to fetch the coaching insights generated by JustCall AI for your meeting. Default entry is true.
        required: false
        name: fetch_ai_insights
        in: query
        schema:
          default: true
          type: boolean
      - name: agent_id
        required: false
        in: query
        description: ID of the agent for whom the AI data for meetings are to be fetched. Agent ID can be accessed using <a href="https://justcall.io/developer-docs/#list_users">List all users API</a>.
        schema:
          type: number
      - name: from_datetime
        required: false
        in: query
        description: Datetime in <b>yyyy-mm-dd hh:mm:ss</b> or <b>yyyy-mm-dd</b> format starting from when the meetings AI data are to be fetched in <b>UTC Timezone</b>.
        schema:
          type: string
      - name: to_datetime
        required: false
        in: query
        description: Datetime in <b>yyyy-mm-dd hh:mm:ss</b> or <b>yyyy-mm-dd</b> format till when the meetings AI data are to be fetched in <b>UTC Timezone</b>.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Page number for which meetings are to be fetched.
        schema:
          type: number
      - name: per_page
        required: false
        in: query
        description: Number count of meetings to be fetched per page.<br>Default value is 10 and maximum value is 20.
        schema:
          type: number
      - name: order
        required: false
        in: query
        description: 'Order in which the meetings should appear based on ‘Date created’ASC : Older data will appear first followed by recent oneDESC: Recent data will appear first followed by older one'
        schema:
          default: desc
          enum:
          - asc
          - desc
          - natural
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingAIResponseDTO'
        '400':
          description: Failed due to bad request params.
        '401':
          description: Failed due to unauthorized access.
        '403':
          description: This error occurred when there is some validation error or you don't have access to that resource.
        '404':
          description: Requested resource may not exist.
        '500':
          description: This is due to internal server error reason, in this case please contact our support team with attached uuid.
      tags:
      - JustCall AI
      security:
      - AccessToken: []
