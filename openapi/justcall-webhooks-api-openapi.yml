          - call.voicemail
          - call.missed
          - call.ai_voice_agent
          - sms.sent_received
          - sms.sent
          - sms.received
          - sms.status_updated
          - sd.call_completed
          - sd.call_updated
          - sd.call_ai_generated
          - whatsapp.message_sent
          - whatsapp.message_received
          - whatsapp.message_status_updated
          - appointment.scheduled
