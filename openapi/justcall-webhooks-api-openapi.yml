openapi: 3.2.0
info:
  title: JustCall Webhooks API
  description: 'REST APIs

    The REST APIs provide programmatic access to read and write JustCall data. Create a new contact, read them, add notes, and more'
  version: '2'
  contact: {}
servers:
- url: https://api.justcall.io
tags:
- name: Webhooks
paths:
  /v2/webhooks:
    post:
      operationId: webhook_create
      summary: Add URL to webhook
      description: Use this endpoint to add a new URL to a webhook event.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreateDTO'
      responses:
        '200':
          description: Updated webhook object after URL is added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponseDTO'
        '400':
          description: Failed due to bad request params.
        '401':
          description: Failed due to unauthorized access.
        '403':
          description: This error occurred when there is some validation error or you don't have access to that resource.
        '404':
          description: Requested resource may not exist.
        '500':
          description: This is due to internal server error reason, in this case please contact our support team with attached uuid.
      tags:
      - Webhooks
      security:
      - AccessToken: []
    get:
      operationId: webhook_list
      summary: List subscribed webhooks
      description: Retrieve all subscribed events for an account or refine the search by specific event type.
      parameters:
      - name: type
        required: false
        in: query
        description: Select a type to search for subscribed events of a specific type.
        schema:
          enum:
          - call.completed
          - call.answered
          - call.initiated
          - call.incoming
          - call.updated
          - call.enters_queue
          - call.exits_queue
          - jc.call_ai_generated
          - call.voicemail
          - call.missed
          - call.ai_voice_agent
          - sms.sent_received
          - sms.sent
          - sms.received
          - sms.status_updated
          - sd.call_completed
          - sd.call_updated
          - sd.call_ai_generated
          - whatsapp.message_sent
          - whatsapp.message_received
          - whatsapp.message_status_updated
          - appointment.scheduled
          - jc.contact_status_updated
          type: string
      responses:
        '200':
          description: Array of webhook objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookListResponseDTO'
        '400':
          description: Failed due to bad request params.
        '401':
          description: Failed due to unauthorized access.
        '403':
          description: This error occurred when there is some validation error or you don't have access to that resource.
        '404':
          description: Requested resource may not exist.
        '500':
          description: This is due to internal server error reason, in this case please contact our support team with attached uuid.
      tags:
      - Webhooks
      security:
      - AccessToken: []
