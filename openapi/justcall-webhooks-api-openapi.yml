  /v2/webhooks/url/{url_id}:
    delete:
      operationId: webhook_delete_url
      summary: Remove URL from webhook
      description: Use this endpoint to remove a URL from a webhook event.
      parameters:
      - name: url_id
        required: true
        in: path
        description: Enter the id of the URL which needs to be deleted. If required, please lookup the ‘url_id’ using the ‘List subscribed webhooks’ endpoint.
        schema:
          example: 65b17425xxxxx
          type: string
      responses:
        '200':
          description: Updated webhook object after URL is deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResponseDTO'
        '400':
