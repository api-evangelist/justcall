components:
  schemas:
    WebhookCreateDTO:
      type: object
      properties:
        webhook_url:
          type: string
          example: https://webhook.site/3afbb926-39a2-4f18-a95e-69e20b2d9aa0
          description: Configure the URL on which you want to receive the response.
        type:
          type: string
          example: call.completed
          description: Select an event type to add URL.
          enum:
          - call.completed
          - call.answered
          - call.initiated
          - call.incoming
          - call.updated
          - call.enters_queue
          - call.exits_queue
          - jc.call_ai_generated
          - call.voicemail
          - call.missed
          - call.ai_voice_agent
          - sms.sent_received
          - sms.sent
          - sms.received
          - sms.status_updated
          - sd.call_completed
          - sd.call_updated
          - sd.call_ai_generated
          - whatsapp.message_sent
          - whatsapp.message_received
          - whatsapp.message_status_updated
          - appointment.scheduled
          - jc.contact_status_updated
      required:
      - webhook_url
      - type
    WebhookListResponseDTO:
      type: object
      properties:
        count:
          type: number
          default: 0
          description: Number of events on the current page.
        total_count:
          type: number
          default: 0
          description: Total number of events fetched.
        current_page:
          type: number
          default: 0
          description: Number of the current page.
        per_page:
          type: number
          default: 0
          description: Maximum number of events appearing per page.
        next_page_link:
          type: string
          default: ''
          description: Link to the next page containing events.
        prev_page_link:
          type: string
          default: ''
          description: Link to the previous page of events.
        data:
          default:
          - type: call.completed
            latest_api_version: '2.1'
            url_count: 1
            warning_url_count: 0
            blacklisted_url_count: 0
            webhook_urls:
            - webhook_url: https://webhook.site/2912255e-7fe1-43f5
              url_id: 65b17425xxxxx
              api_version: '2.1'
              datetime: '2024-02-06 15:36:38'
              status: Active
          description: Array of webhook objects
          type: array
          items:
            $ref: '#/components/schemas/WebhookResponseDTO'
    WebhookUrlsResponseDTO:
      type: object
      properties:
        webhook_url:
          type: string
          default: https://webhook.site/2912255e-7fe1-43f5xxx
          description: Configured URL on which you will receive the event response.
        url_id:
          type: string
          default: 65b17425xxxx
          description: Unique id of the URL
        api_version:
          type: string
          default: '2.1'
          description: API version
        datetime:
          type: string
          default: '2017-12-17 15:36:38'
          description: Date time of webhook creation.
        status:
          type: string
          default: Active
          description: URL status
    WebhookResponseDTO:
      type: object
      properties:
        type:
          type: string
          default: call.completed
          description: Name of the event.
        latest_api_version:
          type: string
          default: '2.1'
          description: The latest available API version. When you add a new URL to any webhook event, you will receive data compatible with this API version.
        url_count:
          type: number
          default: 0
          description: Total number of URLs added to the event.
        warning_url_count:
          type: number
          default: 0
          description: Total number of URLs with Warning status.
        blacklisted_url_count:
          type: number
          default: 0
          description: Total number of URLs with Blacklisted status.
        webhook_urls:
          default:
          - webhook_url: https://webhook.site/2912255e-7fe1-43f5
            url_id: 65b17425xxxxx
            api_version: '2.1'
            datetime: '2024-02-06 15:36:38'
            status: Active
          description: Array of objects with each object consisting of webhook_url, url_id, datetime, api_version and status
          type: array
          items:
            $ref: '#/components/schemas/WebhookUrlsResponseDTO'
  securitySchemes:
    AccessToken:
      type: apiKey
      in: header
      name: Authorization
      description: 'The API key can be put in the Authorization header. i.e Authorization: api_key:api_secret. If you use cURL, specify -u “api_key:api_secret”'
