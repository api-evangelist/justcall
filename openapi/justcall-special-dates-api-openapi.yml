openapi: 3.2.0
info:
  title: JustCall Special Dates API
  description: 'REST APIs

    The REST APIs provide programmatic access to read and write JustCall data. Create a new contact, read them, add notes, and more'
  version: '2'
  contact: {}
servers:
- url: https://api.justcall.io
tags:
- name: Special Dates
paths:
  /v2.1/special_dates:
    get:
      operationId: special_dates_list_v21
      summary: List all special dates
      description: Fetch a list of special dates added to your JustCall account. Use query parameters to paginate and search by name.
      parameters:
      - name: per_page
        required: false
        in: query
        description: Number of special date records to be fetched per page. Default value is 50 and maximum value is 100.
        schema:
          example: 50
          type: number
      - name: page
        required: false
        in: query
        description: Page number for which special date records are to be fetched. Default value is 0.
        schema:
          example: 0
          type: number
      - name: search
        required: false
        in: query
        description: Search special dates by name.
        schema:
          example: Holiday
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSpecialDatesResponseDto'
        '400':
          description: Failed due to bad request params.
        '401':
          description: Failed due to unauthorized access.
        '403':
          description: This error occurred when there is some validation error or you don't have access to that resource.
        '404':
          description: Requested resource may not exist.
        '500':
          description: This is due to internal server error reason, in this case please contact our support team with attached uuid.
      tags:
      - Special Dates
      security:
      - AccessToken: []
    post:
      operationId: special_dates_create_v21
      summary: Create a special date
      description: Create a special date by sending a name, timezone, and one or more time slots.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpecialDateBodyDto'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialDateResponseDto'
        '400':
          description: Failed due to bad request params.
        '401':
          description: Failed due to unauthorized access.
        '403':
          description: This error occurred when there is some validation error or you don't have access to that resource.
        '404':
          description: Requested resource may not exist.
        '500':
          description: This is due to internal server error reason, in this case please contact our support team with attached uuid.
      tags:
      - Special Dates
      security:
      - AccessToken: []
  /v2.1/special_dates/{id}:
    get:
      operationId: special_dates_get_v21
      summary: Get a special date
      description: Get data for a specific special date by sending its id.
      parameters:
      - name: id
        required: true
        in: path
        description: Unique id of the special date as generated by JustCall. Special date id can be accessed using <a href="https://developer.justcall.io/reference/special_dates_list">List all special dates API</a>.
        schema:
          type: number
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialDateResponseDto'
        '400':
          description: Failed due to bad request params.
        '401':
          description: Failed due to unauthorized access.
        '403':
          description: This error occurred when there is some validation error or you don't have access to that resource.
        '404':
          description: Requested resource may not exist.
        '500':
          description: This is due to internal server error reason, in this case please contact our support team with attached uuid.
      tags:
      - Special Dates
      security:
      - AccessToken: []
    put:
      operationId: special_dates_update_v21
      summary: Update a special date
      description: Update a special date by sending its id along with the name, timezone, and/or time slots to change.
      parameters:
      - name: id
        required: true
        in: path
        description: Unique id of the special date as generated by JustCall. Special date id can be accessed using <a href="https://developer.justcall.io/reference/special_dates_list">List all special dates API</a>.
        schema:
          type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSpecialDateBodyDto'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialDateResponseDto'
        '400':
          description: Failed due to bad request params.
        '401':
          description: Failed due to unauthorized access.
        '403':
          description: This error occurred when there is some validation error or you don't have access to that resource.
        '404':
          description: Requested resource may not exist.
        '500':
          description: This is due to internal server error reason, in this case please contact our support team with attached uuid.
      tags:
      - Special Dates
      security:
      - AccessToken: []
    delete:
      operationId: special_dates_delete_v21
      summary: Delete a special date
      description: Delete a special date by sending its id.
      parameters:
      - name: id
        required: true
        in: path
        description: Unique id of the special date as generated by JustCall. Special date id can be accessed using <a href="https://developer.justcall.io/reference/special_dates_list">List all special dates API</a>.
        schema:
          type: number
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSpecialDateResponseDto'
        '400':
          description: Failed due to bad request params.
        '401':
          description: Failed due to unauthorized access.
        '403':
          description: This error occurred when there is some validation error or you don't have access to that resource.
        '404':
          description: Requested resource may not exist.
        '500':
          description: This is due to internal server error reason, in this case please contact our support team with attached uuid.
      tags:
      - Special Dates
      security:
      - AccessToken: []
components:
  schemas:
    SpecialDateCreatedByDto:
      type: object
      properties:
        first_name:
          type: string
          description: First name of the user who created the special date.
          example: Jane
        last_name:
          type: string
          description: Last name of the user who created the special date.
          example: Doe
    ListSpecialDatesResponseDto:
      type: object
      properties:
        status:
          type: string
          description: Displays the status of the API request.
          example: success
        count:
          type: number
          description: Number of special date records present on the current page.
          example: 1
        current_page:
          type: number
          description: Number of the current page.
          example: 0
        per_page:
          type: number
          description: Maximum number of special date records appearing per page.
          example: 50
        next_page_link:
          type: string
          description: Link to the next page containing special date records.
          example: https://api.justcall.io/v2.1/special_dates?page=1
        prev_page_link:
          type: string
          description: Link to the previous page containing special date records.
          example: https://api.justcall.io/v2.1/special_dates?page=0
        data:
          description: Array of special date objects.
          type: array
          items:
            $ref: '#/components/schemas/SpecialDateDto'
    CreateSpecialDateBodyDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the special date. Maximum length is 255 characters. Must be unique for the account.
          example: Christmas Holiday
        timezone:
          type: string
          description: IANA timezone for the special date time slots (e.g. America/New_York). View standard timezone values <a href="https://timezonedb.com/time-zones">here</a>.
          example: America/New_York
        time_slots:
          description: 'Time slots for the special date in the provided timezone. Format: YYYY-MM-DD HH:mm:ss. Maximum 100 time slots.'
          example:
          - from: '2026-12-25 00:00:00'
            to: '2026-12-25 23:59:59'
          type: array
          items:
            $ref: '#/components/schemas/TimeSlotDto'
      required:
      - name
      - timezone
      - time_slots
    TimeSlotDto:
      type: object
      properties:
        from:
          type: string
          description: Start of the time slot in YYYY-MM-DD HH:mm:ss format.
          example: '2026-12-25 00:00:00'
        to:
          type: string
          description: End of the time slot in YYYY-MM-DD HH:mm:ss format.
          example: '2026-12-25 23:59:59'
      required:
      - from
      - to
    UpdateSpecialDateBodyDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the special date. Maximum length is 255 characters. Must be unique for the account.
          example: Updated Holiday
        timezone:
          type: string
          description: IANA timezone for the special date time slots (e.g. America/New_York). View standard timezone values <a href="https://timezonedb.com/time-zones">here</a>.
          example: America/New_York
        time_slots:
          description: 'Time slots for the special date in the provided timezone. Format: YYYY-MM-DD HH:mm:ss. Maximum 100 time slots.'
          example:
          - from: '2026-12-24 00:00:00'
            to: '2026-12-26 23:59:59'
          type: array
          items:
            $ref: '#/components/schemas/TimeSlotDto'
    SpecialDateDto:
      type: object
      properties:
        id:
          type: number
          description: Unique id of the special date as generated by JustCall.
          example: 4005
        name:
          type: string
          description: Name of the special date. Maximum length is 255 characters. Must be unique for the account.
          example: Christmas Holiday
        timezone:
          type: string
          description: IANA timezone for the special date time slots (e.g. America/New_York). View standard timezone values <a href="https://timezonedb.com/time-zones">here</a>.
          example: America/New_York
        created_by:
          $ref: '#/components/schemas/SpecialDateCreatedByDto'
        time_slots:
          description: 'Time slots for the special date in the provided timezone. Format: YYYY-MM-DD HH:mm:ss. Maximum 100 time slots.'
          type: array
          items:
            $ref: '#/components/schemas/TimeSlotDto'
      required:
      - id
      - name
      - timezone
      - time_slots
    DeleteSpecialDateResponseDto:
      type: object
      properties:
        status:
          type: string
          description: Displays the status of the API request.
          example: success
      required:
      - status
    SpecialDateResponseDto:
      type: object
      properties:
        status:
          type: string
          description: Displays the status of the API request.
          example: success
        data:
          $ref: '#/components/schemas/SpecialDateDto'
      required:
      - status
      - data
  securitySchemes:
    AccessToken:
      type: apiKey
      in: header
      name: Authorization
      description: 'The API key can be put in the Authorization header. i.e Authorization: api_key:api_secret. If you use cURL, specify -u “api_key:api_secret”'
x-provenance:
  method: harvested
  publisher: JustCall
  source: https://api.justcall.io/v2/api-docs
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
