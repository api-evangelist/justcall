  /v2.1/texts/threads:
    get:
      operationId: texts_threads_list_v21
      summary: List all threads
      description: Utilize this endpoint to fetch a list of all the threads added to your JustCall account.
      parameters:
      - name: phone_id
        required: true
        in: query
        description: Enter the unique Id of the SMS enabled JustCall phone number
        schema:
          example: 1234
          type: number
      - name: from_datetime
        required: false
        in: query
        description: Date in yyyy-mm-dd hh:mm:ss or yyyy-mm-dd format starting from when the threads are to be fetched
        schema:
          example: '2024-01-01 12:22:23'
          type: string
      - name: to_datetime
        required: false
        in: query
        description: Date in yyyy-mm-dd hh:mm:ss or yyyy-mm-dd format till when the threads are to be fetched
        schema:
          example: '2024-01-01 16:22:23'
          type: string
      - name: contact_number
        required: false
        in: query
        description: Number of the contact for which threads are to be fetched
        schema:
          example: 13801136XXX
          type: string
      - name: keyword
        required: false
        in: query
        description: Filter threads containing texts with a particular keyword. <br>Enter a minimum of 3 and maximum of 15 characters.
        schema:
          example: pricing
          type: string
      - name: tag_id
        required: false
        in: query
        description: Enter the 'Id' of a tag to find all the threads where the particular tag has been applied
        schema:
          example: 9876
          type: number
      - name: per_page
        required: false
        in: query
        description: Number of threads to be fetched per page. Default value is 50 and maximum value is 100.
        schema:
          maximum: 100
          default: 50
          example: 50
          type: number
      - name: page
        required: false
        in: query
        description: Page number for which threads are to be fetched
        schema:
          default: 0
          example: 0
          type: number
      - name: order
        required: false
        in: query
        description: 'Order in which the threads should appear based on Id of the thread. ASC: Older threads will appear first. DESC: Recent threads will appear first.'
        schema:
          example: desc
          enum:
          - asc
          - desc
          - natural
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadsPaginatedResponseDTO'
        '400':
          description: Failed due to bad request params.
        '401':
          description: Failed due to unauthorized access.
        '403':
          description: This error occurred when there is some validation error or you don't have access to that resource.
        '404':
          description: Requested resource may not exist.
        '500':
          description: This is due to internal server error reason, in this case please contact our support team with attached uuid.
      tags:
      - SMS
      security:
      - AccessToken: []
  /v2.1/texts/threads/{thread_id}:
    get:
      operationId: texts_threads_get_v21
      summary: Get a thread
      description: Use this endpoint to access thread data, including messages associated with the thread and tags applied to the thread.
      parameters:
      - name: thread_id
        required: true
        in: path
        schema:
          type: string
      - name: offset
        required: false
        in: query
        description: The starting point from which to retrieve messages within a thread. Used in combination with the limit parameter to paginate results. The value provided will skip the specified number of messages in the texts array and return the next set of messages accordingly.
        schema:
          default: 0
          example: 0
          type: number
      - name: limit
        required: false
        in: query
        description: Count of messages per page in thread response
        schema:
          default: 10
          example: 10
          type: number
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageThreadResponseDto'
        '400':
          description: Failed due to bad request params.
