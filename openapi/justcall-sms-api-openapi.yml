      - SMS
      security:
      - AccessToken: []
    delete:
      operationId: remove_tag_from_thread_v21
      summary: Remove tag from thread
      description: Use this endpoint to remove a tag from a thread or multiple threads associated with the same JustCall or contact number.
      parameters:
      - name: tag_id
        required: true
        in: query
        description: Id of the tag generated by JustCall
        schema:
          example: 9876
          type: number
      - name: thread_id
        required: false
        in: query
        description: Id of the thread generated by JustCall
        schema:
          example: bXhUCCCjUrUGNJMjI2SHR2Z3FGcDJ6WUVuRXXXXXXXX
          type: string
      - name: phone_id
        required: false
        in: query
        description: Id of the JustCall phone number
        schema:
          example: 9876
          type: number
      - name: justcall_number
        required: false
        in: query
        description: Enter a JustCall number to add this tag to all the threads associated with that number
        schema:
          example: 12135663XXX
          type: string
      - name: contact_number
        required: false
        in: query
        description: Enter a contact number to add this tag to all the threads associated with that number
        schema:
          example: 1681381XXXX
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveTagFromThreadResponseDTO'
        '400':
          description: Failed due to bad request params.
