openapi: 3.2.0
info:
  title: JustCall SMS API
  description: 'REST APIs

    The REST APIs provide programmatic access to read and write JustCall data. Create a new contact, read them, add notes, and more'
  version: '2'
  contact: {}
servers:
- url: https://api.justcall.io
tags:
- name: SMS
paths:
  /v2/texts:
    get:
      operationId: texts_list
      summary: List all texts
      description: Retrieve all text messages linked to an account or refine the message selection as needed by utilizing the various query parameter fields.
      parameters:
      - name: from_datetime
        required: false
        in: query
        description: Datetime in <b>yyyy-mm-dd hh:mm:ss</b> or <b>yyyy-mm-dd</b> format starting from when the sms are to be fetched in <b>UTC Timezone</b>.
        schema:
          type: string
      - name: to_datetime
        required: false
        in: query
        description: Datetime in <b>yyyy-mm-dd hh:mm:ss</b> or <b>yyyy-mm-dd</b> format till when the sms are to be fetched in <b>UTC Timezone</b>.
        schema:
          type: string
      - name: last_sms_id_fetched
        required: false
        in: query
        description: Id of the last SMS fetched in the previous query. This Id ensures that you won't receive any duplicate data when using the 'next_page_link' parameter.
        schema:
          type: number
      - name: contact_number
        required: false
        in: query
        description: Number of the contact for which SMS are to be fetched. Please follow the E.164 number format.
        schema:
          type: string
      - name: justcall_number
        required: false
        in: query
        description: JustCall number for which the SMS are to be fetched. Please follow the E.164 number format.
        schema:
          type: string
      - name: sms_direction
        required: false
        in: query
        description: To fetch data only for incoming SMS or for outgoing SMS
        schema:
          enum:
          - incoming
          - outgoing
          type: string
      - name: sms_content
        required: false
        in: query
        description: Keywords of the content of SMS
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Page number for which SMS are to be fetched
        schema:
          type: number
      - name: per_page
        required: false
        in: query
        description: Number of SMS to be fetched per page. Default value is 20 and maximum value is 100.
        schema:
          example: 20
          type: number
      - name: sort
        required: false
        in: query
        description: By default we apply sorting on id field.
        schema:
          default: id
          enum:
          - id
          - datetime
          type: string
      - name: order
        required: false
        in: query
        description: Order in which the SMS list should appear based on the 'sort' parameter selected above.
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsListApiResponseDto'
        '400':
          description: Failed due to bad request params.
        '401':
          description: Failed due to unauthorized access.
        '403':
          description: This error occurred when there is some validation error or you don't have access to that resource.
        '404':
          description: Requested resource may not exist.
        '500':
          description: This is due to internal server error reason, in this case please contact our support team with attached uuid.
      tags:
      - SMS
      security:
      - AccessToken: []
  /v2.1/texts:
    get:
      operationId: texts_list_v21
      summary: List all texts
      description: Retrieve all text messages linked to an account or refine the message selection as needed by utilizing the various query parameter fields.
