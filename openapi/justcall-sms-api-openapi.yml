      - name: contact_number
        required: false
        in: query
        description: Number of the contact for which SMS are to be fetched. Please follow the E.164 number format.
        schema:
          type: string
      - name: justcall_number
        required: false
        in: query
        description: JustCall number for which the SMS are to be fetched. Please follow the E.164 number format.
        schema:
          type: string
      - name: sms_direction
        required: false
        in: query
        description: To fetch data only for incoming SMS or for outgoing SMS
        schema:
          enum:
          - incoming
          - outgoing
          type: string
      - name: sms_content
        required: false
        in: query
        description: Keywords of the content of SMS
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Page number for which SMS are to be fetched
        schema:
          type: number
      - name: per_page
        required: false
        in: query
        description: Number of SMS to be fetched per page. Default value is 20 and maximum value is 100.
        schema:
          example: 20
          type: number
      - name: sort
        required: false
        in: query
        description: By default we apply sorting on id field.
        schema:
          default: id
          enum:
          - id
          - datetime
          type: string
      - name: order
        required: false
        in: query
        description: Order in which the SMS list should appear based on the 'sort' parameter selected above.
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsListApiResponseDto'
        '400':
          description: Failed due to bad request params.
        '401':
          description: Failed due to unauthorized access.
        '403':
          description: This error occurred when there is some validation error or you don't have access to that resource.
        '404':
          description: Requested resource may not exist.
        '500':
          description: This is due to internal server error reason, in this case please contact our support team with attached uuid.
      tags:
      - SMS
      security:
      - AccessToken: []
