components:
  schemas:
    SmsGroupMemberInputDto:
      type: object
      properties:
        type:
          type: string
          description: Whether the member being added is an `agent` (JustCall user within the company) or an external `contact`.
          enum:
          - agent
          - contact
          example: contact
        phone_number:
          type: string
          description: Phone number of the member in E.164 format.
          example: '14155550999'
      required:
      - type
      - phone_number
    SmsGroupMessageResponseDto:
      type: object
      properties:
        id:
          type: number
          description: Unique id of the group SMS message as generated by JustCall.
          example: 15112
        group_id:
          type: number
          description: Id of the group to which this message belongs.
          example: 12345
        sent_by:
          $ref: '#/components/schemas/SmsGroupMemberDto'
        sms_date:
          type: string
          description: Date of the SMS in account timezone.
          example: '2026-04-20'
        sms_user_date:
          type: string
          description: Date of the SMS in user timezone.
          example: '2026-04-22'
        sms_time:
          type: string
          description: Time of the SMS in account timezone.
          example: '13:55:43'
        sms_user_time:
          type: string
          description: Time of the SMS in user timezone.
          example: '13:55:43'
        sms_info:
          $ref: '#/components/schemas/SmsGroupInfoDto'
        medium:
          type: string
          description: Medium through which the SMS was sent.
          example: web
    SmsTagsResponseDTO:
      type: object
      properties:
        id:
          type: number
          example: 9876
          description: Unique id of the tag as generated by JustCall.
        name:
          type: string
          example: Warm Lead
          description: Name of the tag as added by you.
        color_code:
          type: string
          example: '#721ea9'
          description: Hex code of the color.
        created_at:
          type: string
          example: '2025-03-12 19:28:45'
          description: Date and time at which the tag was created in UTC timezone.
        created_by:
          description: Details of the Agent who created the tag.
          allOf:
          - $ref: '#/components/schemas/SmsTagCreatedByDTO'
    ThreadTextDto:
      type: object
      properties:
        id:
          type: number
          description: Unique id of the text as generated by JustCall
          example: 1234
        agent_id:
          type: number
          description: Unique id of the agent as generated by JustCall
          example: 79885
        agent_name:
          type: string
          description: Name of the agent
          example: John Doe
        agent_email:
          type: string
          description: Email of the agent
          example: john.doe@example.com
        sms_date:
          type: string
          description: Date of the text
          example: '2024-01-01'
        sms_user_date:
          type: string
          description: Date of the text in user timezone
          example: '2024-01-01'
        sms_time:
          type: string
          description: Time of the text
          example: '12:00:00'
        sms_user_time:
          type: string
          description: Time of the text in user timezone
          example: '17:30:00'
        direction:
          type: string
          description: Direction of the text
          example: outbound
        medium:
          type: string
          description: Medium of the text
          example: ''
        delivery_status:
          type: string
          description: Delivery status of the text
          example: delivered
        cost_incurred:
          type: number
          description: Cost incurred for the text
          example: 10
        sms_info:
          $ref: '#/components/schemas/TextInfo'
    ThreadTextsResponseDTO:
      type: object
      properties:
        count:
          type: number
          description: Number of texts in current page
          example: 1
