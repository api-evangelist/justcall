          items:
            $ref: '#/components/schemas/SmsGroupMemberInputDto'
      required:
      - members
    CreateSmsGroupRequestDto:
      type: object
      properties:
        group_name:
          type: string
          description: Name of the SMS group to be created.
          example: Sales Team
        justcall_number:
          type: string
          description: JustCall phone number that will be used to create and own the group. The line will also be added as the first agent in the group.
          example: '14155550100'
        members:
          description: Additional members (agents and/or contacts) to be added as participants of the group at creation time. At least one `contact` entry is required. If no `agent` entry is provided, the `justcall_number` itself is used as the first agent. Duplicate `(type, phone_number)` entries are silently deduplicated.
          type: array
          items:
            $ref: '#/components/schemas/SmsGroupMemberInputDto'
        body:
          type: string
          description: Initial message body sent on group creation.
          example: Hey! this is body.
      required:
      - group_name
      - justcall_number
      - members
      - body
