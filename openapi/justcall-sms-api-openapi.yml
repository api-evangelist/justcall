  /v2.1/texts/groups:
    get:
      operationId: texts_groups_list_v21
      summary: List all groups
      description: Use this endpoint to fetch all SMS groups associated with a specific JustCall number.
      parameters:
      - name: justcall_number
        required: true
        in: query
        description: Filter groups associated with a particular JustCall phone number (E.164 formatted).
        schema:
          example: '14155550100'
          type: string
      - name: per_page
        required: false
        in: query
        description: Number of groups to be fetched per page. Default value is 50 and maximum value is 100.
        schema:
          maximum: 100
          default: 50
          example: 50
          type: number
      - name: page
        required: false
        in: query
        description: Page number (0-indexed) for which groups are to be fetched. Defaults to 0 (first page).
        schema:
          default: 0
          example: 0
          type: number
      - name: order
        required: false
        in: query
        description: 'Order in which the groups should appear based on Id of the group. ASC: Older groups will appear first. DESC: Recent groups will appear first.'
        schema:
          default: desc
          example: desc
          enum:
          - asc
          - desc
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sms_groupsPaginatedResponseDTO'
        '400':
          description: Failed due to bad request params.
        '401':
          description: Failed due to unauthorized access.
        '403':
          description: This error occurred when there is some validation error or you don't have access to that resource.
        '404':
          description: Requested resource may not exist.
        '500':
          description: This is due to internal server error reason, in this case please contact our support team with attached uuid.
      tags:
      - SMS
      security:
      - AccessToken: []
    post:
