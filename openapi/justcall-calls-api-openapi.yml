openapi: 3.2.0
info:
  title: JustCall Calls API
  description: 'REST APIs

    The REST APIs provide programmatic access to read and write JustCall data. Create a new contact, read them, add notes, and more'
  version: '2'
  contact: {}
servers:
- url: https://api.justcall.io
tags:
- name: Calls
paths:
  /v2/calls:
    get:
      operationId: call_list
      summary: List all calls
      description: Retrieve all calls linked to an account or refine the call selection as needed by utilizing the numerous query parameter fields.
      parameters:
      - name: fetch_queue_data
        required: false
        in: query
        description: Set fetch_queue_data to true to fetch queue data like callback time, callback status, callback wait duration, etc. Default entry is false.
        schema:
          default: false
          type: boolean
      - name: from_datetime
        required: false
        in: query
        description: Datetime in <b>yyyy-mm-dd hh:mm:ss</b> or <b>yyyy-mm-dd</b> format starting from when the calls are to be fetched in <b>UTC Timezone</b>.
        schema:
          type: string
      - name: to_datetime
        required: false
        in: query
        description: Datetime in <b>yyyy-mm-dd hh:mm:ss</b> or <b>yyyy-mm-dd</b> format till when the calls are to be fetched in <b>UTC Timezone</b>.
        schema:
          type: string
      - name: contact_number
        required: false
        in: query
        description: 'Number of the contact for which calls are to be fetched.<br>Important: Please provide a valid contact number with country code.'
        schema:
          type: string
      - name: justcall_number
        required: false
        in: query
        description: JustCall number for which the calls are to be fetched.
        schema:
          type: string
      - name: agent_id
        required: false
        in: query
        description: ID of the agent for whom the calls are to be fetched. Agent ID can be accessed using <a href="https://developer.justcall.io/reference/users_list_v21">List all users API</a>.
        schema:
          type: number
      - name: ivr_digit
        required: false
        in: query
        description: 'Enter the IVR digit the calls routed through which need to be filtered (optional) <br><b><font color=''red''>Note: <i>call_direction and call_type filter</i> won''t work in case you send ivr_digit.</font></b> <br>'
        schema:
          type: number
      - name: call_direction
        required: false
        in: query
        description: Enter the direction of calls (incoming/outgoing) to be fetched
        schema:
          enum:
          - Incoming
          - Outgoing
          type: string
      - name: call_type
        required: false
        in: query
        description: Enter the type of calls (answered, unanswered, missed, voicemail, abandoned) that need to be fetched.
        schema:
          enum:
          - OUTGOING_ANSWERED
          - OUTGOING_UNANSWERED
          - OUTGOING_BUSY
          - OUTGOING_FAILED
          - OUTGOING_RESTRICTED
          - OUTGOING_BLOCKED
          - OUTGOING_CANCELLED
          - INCOMING_ANSWERED
          - INCOMING_BUSY
          - INCOMING_FAILED
          - INCOMING_MISSED
          - INCOMING_ABANDONED
          - INCOMING_VOICEMAIL
          type: string
      - name: page
        required: false
        in: query
        description: Page number for which calls are to be fetched
        schema:
          type: number
      - name: per_page
        required: false
        in: query
        description: Number of calls to be fetched per page. Default value is 20 and maximum value is 100.
        schema:
          type: number
      - name: sort
        required: false
        in: query
        description: Select a parameter to sort the order of calls. By default we apply sorting on id field.
        schema:
          default: id
          enum:
          - id
          - datetime
          type: string
      - name: order
        required: false
        in: query
        description: Order in which the calls list should appear based on the 'sort' parameter selected above
        schema:
          default: desc
          enum:
          - asc
          - desc
          - natural
          type: string
      - name: fetch_iq_data
        required: false
        in: query
        description: Set fetch_iq_data to true to fetch coaching data by Justcall IQ. Default entry is false.
        schema:
          default: false
          type: boolean
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallResponseDTO'
        '400':
          description: Failed due to bad request params.
        '401':
          description: Failed due to unauthorized access.
        '403':
          description: This error occurred when there is some validation error or you don't have access to that resource.
        '404':
          description: Requested resource may not exist.
        '500':
          description: This is due to internal server error reason, in this case please contact our support team with attached uuid.
      tags:
      - Calls
      security:
      - AccessToken: []
  /v2.1/calls:
    get:
      operationId: call_list_v21
      summary: List all calls
      description: Retrieve all calls linked to an account or refine the call selection as needed by utilizing the numerous query parameter fields.
      parameters:
      - name: fetch_queue_data
        required: false
        in: query
        description: Set fetch_queue_data to true to fetch queue data like callback time, callback status, callback wait duration, etc. Default entry is false.
        schema:
          default: false
          type: boolean
      - name: from_datetime
        required: false
        in: query
        description: Datetime in <b>yyyy-mm-dd hh:mm:ss</b> or <b>yyyy-mm-dd</b> format starting from when the calls are to be fetched in <b>user's timezone</b>.
        schema:
          type: string
      - name: to_datetime
        required: false
        in: query
        description: Datetime in <b>yyyy-mm-dd hh:mm:ss</b> or <b>yyyy-mm-dd</b> format till when the calls are to be fetched in <b>user's timezone</b>.
        schema:
          type: string
      - name: contact_number
        required: false
        in: query
        description: 'Number of the contact for which calls are to be fetched.<br>Important: Please provide a valid contact number with country code.'
        schema:
          type: string
      - name: justcall_number
        required: false
        in: query
        description: JustCall number for which the calls are to be fetched.
        schema:
          type: string
      - name: agent_id
        required: false
        in: query
        description: ID of the agent for whom the calls are to be fetched. Agent ID can be accessed using <a href="https://developer.justcall.io/reference/users_list_v21">List all users API</a>.
        schema:
          type: number
      - name: ivr_digit
        required: false
        in: query
        description: 'Enter the IVR digit the calls routed through which need to be filtered (optional) <br><b><font color=''red''>Note: <i>call_direction and call_type filter</i> won''t work in case you send ivr_digit.</font></b> <br>'
        schema:
          type: number
      - name: call_direction
        required: false
        in: query
        description: Enter the direction of calls (incoming/outgoing) to be fetched
        schema:
          enum:
          - Incoming
          - Outgoing
          type: string
      - name: call_type
        required: false
        in: query
        description: Enter the type of calls (answered, unanswered, missed, voicemail, abandoned) that need to be fetched.
        schema:
          enum:
          - OUTGOING_ANSWERED
          - OUTGOING_UNANSWERED
          - OUTGOING_BUSY
          - OUTGOING_FAILED
          - OUTGOING_RESTRICTED
          - OUTGOING_BLOCKED
          - OUTGOING_CANCELLED
          - INCOMING_ANSWERED
          - INCOMING_BUSY
          - INCOMING_FAILED
          - INCOMING_MISSED
          - INCOMING_ABANDONED
          - INCOMING_VOICEMAIL
          type: string
      - name: page
        required: false
        in: query
        description: Page number for which calls are to be fetched
        schema:
          type: number
      - name: per_page
        required: false
        in: query
        description: Number of calls to be fetched per page. Default value is 20 and maximum value is 100.
        schema:
          type: number
      - name: sort
        required: false
        in: query
        description: Select a parameter to sort the order of calls. By default we apply sorting on id field.
        schema:
          default: id
          enum:
          - id
          - datetime
          type: string
      - name: order
        required: false
        in: query
        description: Order in which the calls list should appear based on the 'sort' parameter selected above
        schema:
          default: desc
          enum:
          - asc
          - desc
          - natural
          type: string
      - name: fetch_ai_data
        required: false
        in: query
        description: Set fetch_ai_data to true to fetch coaching data by Justcall AI. Default entry is false.
        schema:
          default: false
          type: boolean
      - name: last_call_id_fetched
        required: false
        in: query
        description: Id of the last call fetched in the previous query. This Id ensures that you won't receive any duplicate data when using the 'next_page_link' parameter.
        schema:
          type: number
      - name: call_traits
        required: false
        in: query
        description: Select one or more traits associated with a call to fetch all calls containing those traits.
        schema:
          type: array
          items:
            type: string
            enum:
            - QUEUE
            - CALLBACK
            - FORWARD
            - TRANSFER
            - MERGE
            - IVR
            - VOICE_AGENT
      - name: disposition_codes
        required: false
        in: query
        description: 'Filter calls by the disposition code (call outcome) added by the agent at the end of each call. You can enter an array of codes to filter calls with either of the dispositions from the list. Entered codes must already be present in your JustCall account. Expected format example - if your list title is ‘Sales‘ and your code is ‘Follow Up’ then your input in disposition field should be ‘Sales: Follow Up’.'
        schema:
          type: array
          items:
            type: string
      - name: ai_agent_ids
        required: false
        in: query
        description: IDs of the AI agents for which the calls are to be fetched. AI Agent IDs can be accessed using <a href="https://developer.justcall.io/reference/list_voice_agents_v21"> List all AI agents API</a>.
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallResponse21DTO'
        '400':
          description: Failed due to bad request params.
        '401':
          description: Failed due to unauthorized access.
        '403':
          description: This error occurred when there is some validation error or you don't have access to that resource.
        '404':
          description: Requested resource may not exist.
        '500':
          description: This is due to internal server error reason, in this case please contact our support team with attached uuid.
      tags:
      - Calls
      security:
      - AccessToken: []
