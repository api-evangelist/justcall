    CallTranscriptionDTO:
      type: object
      properties:
        speaker_id:
          type: string
          example: 1
          description: speaker id
        speaker_name:
          type: string
          example: John Doe
          description: speaker name
        sentence:
          type: string
          example: Hey, Can I know the status with the deal?
          description: transcription sentence
        timestamp:
          example:
            starttime: 0
            endtime: 0
          description: Transcription timestamp
          allOf:
          - $ref: '#/components/schemas/TranscriptionTimeStampDTO'
    CallAgentAnalyticsRecordDto:
      type: object
      properties:
        metadata:
          description: Object containing metadata related to the analytics request.
          allOf:
          - $ref: '#/components/schemas/BaseCallAnalyticsMetadataDto'
        agent_id:
          type: number
          description: Id of the agent.
          example: 12345
        agent_name:
          type: string
          example: John Smith
          description: Name of the agent.
        agent_email:
          type: string
          example: john@abc.com
          description: Email id of the agent.
        summary:
          description: Object containing all the metrics for agent level analytics.
          allOf:
          - $ref: '#/components/schemas/CallAgentAnalyticsSummaryDto'
    BaseCallAnalyticsMetadataDto:
      type: object
      properties:
        from_date:
          type: string
          description: Analytics period start date in YYYY-MM-DD format
          example: '2024-01-01'
        to_date:
          type: string
          description: Analytics period end date in YYYY-MM-DD format
          example: '2024-01-31'
    CallDurationDTO:
      type: object
      properties:
        ring_time:
          type: number
          default: 5
          description: Time for which call rings before connecting with the system/agent
        friendly_duration:
          type: string
          default: 00:00:05
          description: Duration of call in standard hh:mm:ss format
        total_duration:
          type: number
          default: 155
          description: Duration of call in seconds = conversation_time+ hold_time
        queue_wait_time:
          type: number
          default: 5
          description: Time for which caller waited in the queue
        hold_time:
          type: number
          default: 5
          description: Time for which caller was put on hold, if not put on hold should be 0
        conversation_time:
          type: number
          default: 5
          description: Total duration without the Hold time
        wrap_up_time:
          type: number
          default: 5
          description: Time set by agent from adding notes & disposition after a call
        handle_time:
          type: number
          default: 5
          description: Total duration + Wrap up time
    UpdateCallDTO:
      type: object
      properties:
        notes:
          type: string
          description: Add or update the note for a call. If a note already exists, it will be completely overwritten. The input supports multiple languages, emojis, and special characters. The note is limited to 1600 encoded characters — content beyond this limit will be automatically truncated.
          default: ''
        disposition_code:
          type: string
          description: 'Add or update the disposition code for a call. The code must already be present in your JustCall account. Expected format example - if your list title is ‘Sales’ and your code is ‘Follow Up’ then your input in disposition field should be ‘Sales: Follow Up’.'
          default: ''
        rating:
          type: number
          description: Update the rating for a call. Please note that ratings should be from 0 to 5 and can contain a 0.5 decimal. Ratings like 2.5, 4.5 are allowed, while ratings like 2.3, 4.6 are not allowed.
    CallVoiceAgentDynamicVariablesResponseDTO:
      type: object
      properties:
        before_call:
          default: {}
          description: Dynamic variables injected into the agent before the call starts. These values can be used to personalize the conversation or prefill context.
          example:
          - name: CallerName
            value: John
            type: string
          type: array
          items:
            $ref: '#/components/schemas/CallVoiceAgentDynamicVariableResponseDTO'
        during_call:
          default: {}
          description: Dynamic variables captured or injected by the AI Agent while the call is in progress. These values can be updated in real time based on the conversation.
          example:
          - name: CallerId
            value: '12345'
            type: string
          type: array
          items:
            $ref: '#/components/schemas/CallVoiceAgentDynamicVariableResponseDTO'
  securitySchemes:
    AccessToken:
      type: apiKey
      in: header
      name: Authorization
      description: 'The API key can be put in the Authorization header. i.e Authorization: api_key:api_secret. If you use cURL, specify -u “api_key:api_secret”'
