          default: []
          example:
          - sequence: 1
            stage: predial_settings
            payload:
              record_call: 'ON'
              ring_time: '30'
              ring_tone: US
              geo_location_restricted: 'no'
          - sequence: 2
            stage: incoming_call_type
            payload:
              action: Call Answered by Voice Agent
              value: ''
          - sequence: 3
            stage: agents_call_timeline
            payload:
            - name: Voice Agent
              agent_id: null
              agent_status: Answered
              availability_status: available
              unavailability_reason: ''
              ring_modes:
              - web
              ringtime: 1
              call_web_timeline:
              - action: Call initiated
                time: 03:37:46 PM
              - action: Ringing
                time: 03:37:46 PM
              - action: Answered
                time: 03:37:47 PM
              - action: Call forwarded by voice agent
                time: 03:38:03 PM
              call_mobile_timeline: []
          - sequence: 4
            stage: post_call_action
            payload:
              action: Call Route 1 activated
              action_data:
                auto_reconnect: 'no'
                queue_time: '0'
                call_timeline: []
          - sequence: 5
            stage: forwarding_details
            payload:
              forwarding_type: Ring groups - Ring All
              forwarding_details:
                agent_id: null
                phone_number: ''
                user_group_name: Inhouse Team
                smart_route_info: {}
          - sequence: 6
            stage: agents_call_timeline
            payload:
            - name: John Smith
              agent_id: 1234321
              agent_status: Dialer Not Connected
              availability_status: available
              unavailability_reason: ''
              ring_modes:
              - web
              ringtime: 0
              call_web_timeline:
              - action: Call initiated
                time: 03:38:03 PM
              - action: No answer
                time: 03:38:03 PM
              call_mobile_timeline: []
          - sequence: 7
            stage: greeting_message
            payload:
            - is_mp3: false
              title: Unanswered text message
              content: All agents are currently unavailable. Please try calling back later.
          - sequence: 8
            stage: call_ended
            payload: {}
          type: array
          items:
