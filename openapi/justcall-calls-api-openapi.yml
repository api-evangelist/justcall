          description: Unique id of the call as generated by JustCall
        call_sid:
          type: string
          default: CA0247d967e9bb3c284163a37a43XXXX
          description: Unique call sid of the call as generated by JustCall
        contact_number:
          type: string
          default: 13801136XXX
          description: Phone number of the contact
        contact_name:
          type: string
          default: Rachel G.
          description: Name of the contact
        contact_email:
          type: string
          default: john@suits.co
          description: Email id of the contact
        justcall_number:
          type: string
          default: 12707705XXX
          description: JustCall number used by the agent to make or receive the call
        justcall_line_name:
          type: string
          default: Sales Line
          description: If line name added, the name is sent otherwise blank
        agent_id:
          type: number
          default: 1308
          description: Id of the agent who made or received the call
        agent_name:
          type: string
          default: John Smith
          description: Name of the agent who made or received the call
        agent_email:
          type: string
          default: john@abc.com
          description: Email id of the agent who made or received the call
        agent_active:
          type: string
          default: Active
          description: Whether the agent associated with the call is active or not
        call_date:
          type: string
          default: '2017-12-18'
          description: Date of call in UTC
        call_user_date:
          type: string
          default: '2017-12-17'
          description: Date of call in users timezone
        call_time:
          type: string
          default: '13:55:43'
          description: Timestamp of call in UTC
        call_user_time:
          type: string
          default: '8:25:43'
          description: Timestamp of call in users timezone
        cost_incurred:
          type: number
          default: 0.005
          description: Charge for the particular call
        call_info:
