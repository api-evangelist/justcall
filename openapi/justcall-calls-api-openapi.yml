components:
  schemas:
    CallVoiceAgentDynamicVariableResponseDTO:
      type: object
      properties:
        name:
          type: string
          description: The unique identifier used to reference this variable within the agent's logic or script.
          default: ''
          example: CallerName
        value:
          type: string
          description: The dynamic variable value injected before the call or captured during the call.
          default: ''
          example: John
        type:
          type: string
          description: 'Defines the expected data type of the variable (e.g., string, number, boolean, date). Default: String'
          default: string
          example: string
    CallVoiceAgentDtmfInputResponseDTO:
      type: object
      properties:
        user_input:
          type: string
          default: ''
          example: '1523'
          description: The digit pressed by the user and detected by the AI Voice Agent during the call. This will always be a single-character string such as "1", "2", "3", "*", or "#".
        executed_at:
          type: string
          default: ''
          example: '2025-07-18 10:00:00'
          description: Timestamp at which the DTMF input was received
    JustCallIQDTO:
      type: object
      properties:
        call_moments:
          example:
          - exams
          - math
          - confidence
          description: List of most important keywords associated with a call
          type: array
          items:
            type: string
        customer_sentiment:
          type: string
          example: Positive
          description: Overall analysis of the sentiment of the customer based on words and tone
        call_score:
          type: number
          default: 0
          description: Overall score of the call out of 10
        call_score_parameters:
          $ref: '#/components/schemas/CallScoreParameter'
        tags:
          default: []
          example:
          - demo
          - follow-up
          description: Tags added by the user(agent) for a call
          type: array
          items:
            type: string
        manual_call_score:
          type: number
          default: 0
          example: 4
          description: Average of all manual scores added
        call_summary:
          type: string
          example: Call summary
          description: A summary of the key highlights and takeaways from a call
        call_transcription:
          default: []
          example:
          - speaker_id: 1
            sentence: Hey, Can I know the status with the deal?
            timestamp:
              starttime: 0
              endtime: 0
          description: A translation of the audio call into written text in a script like format
          allOf:
          - $ref: '#/components/schemas/CallTranscriptionDTO'
    CallInfoDTO:
      type: object
      properties:
        direction:
          type: string
          default: Outgoing/Incoming
          description: Whether the call was an Outgoing call or an Incoming Calls
        type:
          type: string
          default: Answered
