components:
  schemas:
    SDContactUpdateDTO:
      type: object
      properties:
        name:
          type: string
          description: Name of the contact
          example: John Smith
        email:
          type: string
          description: Email id of the contact
          example: jhon.smith@example.com
        birthday:
          type: string
          description: Birth date of the contact in yyyy-mm-dd format
          example: '1996-01-25'
        occupation:
          type: string
          description: Occupation of the contact
          example: sales executive
        address:
          type: string
          description: Address of the contact
          example: 123, street 2
        deal_size:
          type: number
          description: Deal size associated with the contact
          example: 10000
        custom_fields:
          description: Array of objects
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldUpdateDTO'
    SDCampaignResponseDTO:
      type: object
      properties:
        id:
          type: number
          default: 173
          description: Id of campaign to which the contact is added when dialing
        name:
          type: string
          default: Summer Batch 2023
          description: Name of campaign to which the contact is added when dialing
        type:
          type: string
          default: Autodial
          description: Autodial, Predictive or Dynamic campaign
        default_number:
          type: string
          default: 1438729XXX
          description: Default phone number set for the campaign
    ListContactCustomFieldsApiResponse:
      type: object
      properties:
        status_code:
          type: number
          description: HTTP status code of the response.
          example: 200
        status:
          type: string
          description: 'Displays the status of the API request: "success" for successful requests; error message for failed requests.'
          example: success
        total:
          type: number
          description: Total number of contact based custom fields present in your Sales Dialer account
          example: '1'
        data:
          description: Array of custom contact field objects.
          example:
          - label: membership_status
            id: 1090960
            type: string
          type: array
          items:
            $ref: '#/components/schemas/CustomContactField'
    JustCallIQDTO:
      type: object
      properties:
        call_moments:
          example:
          - exams
          - math
          - confidence
          description: List of most important keywords associated with a call
          type: array
          items:
            type: string
        customer_sentiment:
          type: string
          example: Positive
          description: Overall analysis of the sentiment of the customer based on words and tone
        call_score:
          type: number
          default: 0
          description: Overall score of the call out of 10
        call_score_parameters:
          $ref: '#/components/schemas/CallScoreParameter'
        tags:
          default: []
          example:
          - demo
          - follow-up
          description: Tags added by the user(agent) for a call
          type: array
          items:
            type: string
        manual_call_score:
          type: number
          default: 0
          example: 4
          description: Average of all manual scores added
        call_summary:
          type: string
          example: Call summary
          description: A summary of the key highlights and takeaways from a call
        call_transcription:
          default: []
          example:
          - speaker_id: 1
            sentence: Hey, Can I know the status with the deal?
            timestamp:
              starttime: 0
              endtime: 0
          description: A translation of the audio call into written text in a script like format
          allOf:
          - $ref: '#/components/schemas/CallTranscriptionDTO'
    RemoveSDContactDTO:
      type: object
      properties:
        status:
          type: string
          description: Displays the status of the API request
          example: success
    CampaignContacts:
      type: object
      properties:
        uploaded:
          type: number
          description: Number of contacts successfully uploaded
          example: 0
        imported:
          type: number
          description: Number of contacts that were imported
          example: 0
        duplicate_contacts:
          type: number
          description: Number of duplicate contacts
          example: 0
        without_phone_number:
          type: number
          description: Count of contacts that do not have a valid phone number
          example: 0
    SDCallsStatsResponseDTO:
      type: object
      properties:
        agent_id:
          type: number
          default: 142345
          description: Id of the agent who made the call
        agent_name:
          type: string
          default: John Smith
          description: Name of the agent for whom report is generated
        agent_email:
          type: string
          default: abc@xyz.com
          description: Email id of the agent for whom report is generated
        dialed_calls:
          type: number
          default: 228
          description: Total number of calls dialed by agent in all campaigns
        answered_calls:
          type: number
          default: 56
          description: Total number of answered calls dialed by agent in all campaigns
        abandoned_calls:
          type: number
          default: 25
          description: Total number of calls dialed by an agent which get abandoned
        connection_rate:
          type: number
          default: 24
          description: Connection rate
        total_call_duration:
          type: string
          default: 03:02:10
          description: Total call duartion across campaigns by the agent
        average_call_duration:
          type: string
          default: 05:00:10
          description: Average call duration
        max_call_duration:
          type: string
          default: 01:00:00
          description: Maximum durations of any call during any campaign by the agent
        agent_success_rate:
          type: number
          default: 86
          description: Total number of calls where success disposition was added out of the total answered calls
        total_unanswered_calls:
          type: number
          default: 77
          description: Total number of calls not picked up end customers
        total_voicemails_drops:
          type: number
          default: 23
          description: Total calls in which voicemails are dropped
        total_cost_incurred:
          type: number
          default: 60.17
          description: Total cost incurred for all calls of an agent across all campaigns
        campaigns_run:
          type: number
          default: 15
          description: Number of compaigns run by each agent
        total_after_call_work:
          type: string
          default: 02:54:44
          description: Total time spent by an agent to fill in notes, dispotion and all other details after the call for all calls across campaigns for an agent
        pause_time:
          type: string
          default: 0:10:45
          description: Total pause time by the agent across campaigns
        available_time_in_campaign:
          type: string
          default: '5:10:25'
          description: Total time spent by agent running all campaigns
      required:
      - agent_name
    BulkImportSdContactsImportSummary:
      type: object
      properties:
        received:
          type: number
          example: 250
          description: Total number of contacts received in the import request.
        added:
          type: number
          example: 240
          description: Number of contacts added or updated successfully at the time of this API hit.
        queued:
          type: number
          example: 3
          description: Number of contacts in the queue (yet to be processed) at the time of this API hit.
        rejected:
          type: number
          example: 2
          description: Number of contacts already rejected by the system at the time of this API hit.
        rejected_list:
          example:
          - 0
          - 220
          description: Lists the array index positions of the rejected contacts.
          type: array
          items:
            type: number
        duplicate:
          type: number
          example: 5
          description: Number of contacts already flagged as duplicate contacts (as a result removed from the process of adding to a campaign) at the time of this API hit.
        duplicate_list:
          example:
          - 3
          - 104
          - 119
          - 204
          - 242
          description: Lists the array index positions of the duplicate contacts.
          type: array
          items:
            type: number
    CustomFieldDTO:
      type: object
      properties:
        id:
          type: number
          description: Unique Id of the field as generated by Sales Dialer.
          example: 1101123
        value:
          type: string
          description: Data to be stored in this custom field.
          example: NewYork
    BaseSDCampaignDTO:
      type: object
      properties:
        id:
          type: number
          description: Unique ID of the campaign as generated by JustCall
          example: 1234
        name:
          type: string
          description: Name provided to the campaign
          example: Website Leads
        type:
          type: string
          description: Type of the campaign (e.g., Autodial, Predictive, Dynamic)
          example: Autodial
        default_number:
          type: string
          description: Default phone number set for the campaign
          example: 1438729XXX
        created_date:
          type: string
          description: Date of campaign creation
          example: '2024-01-01'
        created_time:
          type: string
          description: Time of campaign creation
          example: '12:00:00'
        created_by_id:
          type: number
          description: ID of the agent who created the campaign
          example: 10090
        created_by_name:
          type: string
          description: Name of the agent who created the campaign
