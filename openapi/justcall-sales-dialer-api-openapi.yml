openapi: 3.2.0
info:
  title: JustCall Sales Dialer API
  description: 'REST APIs

    The REST APIs provide programmatic access to read and write JustCall data. Create a new contact, read them, add notes, and more'
  version: '2'
  contact: {}
servers:
- url: https://api.justcall.io
tags:
- name: Sales Dialer
paths:
  /v2/sales_dialer/calls:
    get:
      operationId: sales_dialer_call_list
      summary: List all calls
      description: Retrieve all Sales Dialer calls linked to an account or customize the call selection by leveraging the extensive set of query parameters available.
      parameters:
      - name: campaign_id
        required: false
        in: query
        description: Campaign ID of the Campaign for which you wish to fetch the calls. You can find the Campaign ID in the Campaigns tab in your Sales Dialer account below the name of each Campaign. Please use only the numerical part as the ID.
        schema:
          type: number
      - name: from_datetime
        required: false
        in: query
        description: Datetime in <b>yyyy-mm-dd hh:mm:ss</b> or <b>yyyy-mm-dd</b> format starting from when the calls are to be fetched in <b>UTC Timezone</b>.
        schema:
          type: string
      - name: to_datetime
        required: false
        in: query
        description: Datetime in <b>yyyy-mm-dd hh:mm:ss</b> or <b>yyyy-mm-dd</b> format till when the calls are to be fetched in <b>UTC Timezone</b>.
        schema:
          type: string
      - name: contact_number
        required: false
        in: query
        description: 'Number of the contact for which calls are to be fetched.<br>Important: Please provide a valid contact number with country code.'
        schema:
          type: number
      - name: sales_dialer_number
        required: false
        in: query
        description: Sales Dialer number for which the calls are to be fetched.
        schema:
          type: number
      - name: agent_id
        required: false
        in: query
        description: ID of the agent for whom the calls are to be fetched. Agent ID can be accessed using <a href="https://developer.justcall.io/reference/users_list_v21">List all users API</a>.
        schema:
          type: number
      - name: call_type
        required: false
        in: query
        description: Enter the type of calls (answered, unanswered, abandoned) that need to be fetched.
        schema:
          enum:
          - OUTGOING_ANSWERED_CALL
          - OUTGOING_HUMAN_ANSWERED
          - OUTGOING_MACHINE_ANSWERED
          - OUTGOING_UNANSWERED_CALL
          - OUTGOING_FAILED_CALL
          - OUTGOING_RESTRICTED_CALL
          - OUTGOING_BLOCKED_CALL
          - OUTGOING_CANCELLED_CALL
          - OUTGOING_ABANDONED_CALL
          type: string
      - name: page
        required: false
        in: query
        description: Page number for which calls are to be fetched
        schema:
          type: number
      - name: per_page
        required: false
        in: query
        description: Number of calls to be fetched per page. Default value is 20 and maximum value is 100.
        schema:
          type: number
      - name: sort
        required: false
        in: query
        description: Select a parameter to sort the order of calls. By default we apply sorting on id field.
        schema:
          default: id
          enum:
          - id
          - datetime
          type: string
      - name: order
        required: false
        in: query
        description: Order in which the calls list should appear based on the 'sort' parameter selected above
        schema:
          default: desc
          enum:
          - asc
          - desc
          - natural
          type: string
      - name: fetch_iq_data
        required: false
        in: query
        description: Set fetch_iq_data to true to fetch coaching data by Justcall IQ. Default entry is false
        schema:
          type: boolean
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SDCallResponseDTO'
        '400':
          description: Failed due to bad request params.
        '401':
          description: Failed due to unauthorized access.
        '403':
          description: This error occurred when there is some validation error or you don't have access to that resource.
        '404':
          description: Requested resource may not exist.
        '500':
          description: This is due to internal server error reason, in this case please contact our support team with attached uuid.
      tags:
      - Sales Dialer
      security:
      - AccessToken: []
