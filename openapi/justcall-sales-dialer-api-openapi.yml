      - name: to_datetime
        required: false
        in: query
        description: Datetime in <b>yyyy-mm-dd hh:mm:ss</b> or <b>yyyy-mm-dd</b> format till when the campaigns are to be fetched in <b>UTC Timezone</b>.
        schema:
          type: string
      - name: type
        required: false
        in: query
        description: Search for a particular type of campaign from Autodial, Predictive or Dynamic
        schema:
          enum:
          - Autodial
          - Predictive
          - Dynamic
          type: string
      - name: contact_number
        required: false
        in: query
        description: Search for all campaigns where a particular contact has been added
        schema:
          example: 1213566XXXX
          type: string
      - name: sales_dialer_number
        required: false
        in: query
        description: Search for all campaigns where a particular Sales Dialer number is set as the default number
        schema:
