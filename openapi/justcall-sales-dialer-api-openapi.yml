      - Sales Dialer
      security:
      - AccessToken: []
  /v2.1/sales_dialer/campaigns/contacts:
    get:
      operationId: sales_dialer_campaign_contacts_list_v21
      summary: List campaign contacts
      description: Access this endpoint to fetch a list of all the contacts present in a particular Sales Dialer campaign or filter them based on their status or progress in the campaign.
      parameters:
      - name: campaign_id
        required: true
        in: query
        description: Unique id of the campaign generated by Sales Dialer. You can find the Campaign ID in the Campaigns tab in your Sales Dialer account below the name of each Campaign. Please use only the numerical part as the ID
        schema:
          example: 1234
          type: number
      - name: contact_status
        required: false
        in: query
        description: Set contact status to ‘Active’, ‘DNCA’, or ‘Invalid’ to filter based on the status of a contact’s number in a specific campaign
        schema:
          example: Active
          enum:
          - Active
          - Invalid
          - DNCA
          type: string
      - name: progress_status
        required: false
        in: query
        description: Set progress status to ‘Dialed’, ‘Undialed’ or ‘Skipped’ to filter contacts in a campaign based on whether they have been contacted successfully or not
        schema:
          example: Dialed
          enum:
          - Dialed
          - Skipped
          - Undialed
          type: string
      - name: per_page
        required: false
        in: query
        description: Number of contacts to be fetched per page. Default value will be 10.
        schema:
          example: 20
          type: number
      - name: page
        required: false
        in: query
        description: Page number for which contacts are to be fetched. Default value will be 0.
        schema:
          example: 2
          type: number
      - name: order
        required: false
        in: query
        description: Order in which the contacts list should appear (asc or desc). Sorting is done based on contact creation time and recent contacts are represented with larger ID values. Default value will be desc.
        schema:
          example: desc
          enum:
          - asc
          - desc
          - natural
          type: string
      responses:
        '200':
          description: Successful response.
