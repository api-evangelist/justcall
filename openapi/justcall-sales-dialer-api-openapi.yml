      security:
      - AccessToken: []
    delete:
      operationId: sales_dialer_remove_contact_from_campaign_v21
      summary: Remove contact from a campaign
      description: Utilize this endpoint to remove a particular contact from a campaign or remove all contacts from the campaign.
      parameters:
      - name: campaign_id
        required: true
        in: query
        description: Unique id of the campaign generated by Sales Dialer. You can find the Campaign ID in the Campaigns tab in your Sales Dialer account below the name of each Campaign. Please use only the numerical part as the ID.
        schema:
          example: 1234
          type: number
      - name: contact_id
        required: false
        in: query
        description: Id of the contact to remove from the campaign. This field, if sent, will be used to search for the contact. Please send only one of contact_id and phone_number fields.
        schema:
          example: 12345
          type: number
      - name: phone_number
        required: false
        in: query
        description: Phone number of the contact. This field, if sent, will be used by us to search the contact. Please send only one of contact_id and phone_number fields.
        schema:
          example: 1213566XXXX
          type: string
      - name: remove_all
        required: false
        in: query
        description: Set this parameter to true to remove all contacts from a particular campaign. The default value is false.
        schema:
          default: false
          example: 'false'
          type: boolean
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveSDContactDTO'
        '400':
          description: Failed due to bad request params.
        '401':
          description: Failed due to unauthorized access.
        '403':
          description: This error occurred when there is some validation error or you don't have access to that resource.
        '404':
          description: Requested resource may not exist.
        '500':
          description: This is due to internal server error reason, in this case please contact our support team with attached uuid.
